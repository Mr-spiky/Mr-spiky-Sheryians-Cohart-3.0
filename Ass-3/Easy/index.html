<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Squid Game</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">
                <img src="image/logo.png" alt="Squid Game Logo">
            </div>
            <nav>
                <ul>
                    <li><a href="#">About</a></li>
                    <li><a href="#" class="active">Watch now</a></li>
                    <li><a href="#">Actors</a></li>
                    <li><a href="#">Contact</a></li>
                </ul>
            </nav>
            <div class="menu-icon">
                <i class="fa-solid fa-bars"></i>
            </div>
        </header>

        <main>
            <div class="content">
                <div class="title">
                    <img src="./image/logo1.png" alt="Squid Game Logo">
                </div>
                <p>Action / Thriller / Drama Series directed by Dong-hyuk Hwang</p>
                <p>Season 1: 9 Episodes</p>
                <div class="buttons">
                    <button class="play-now"><i class="fa-solid fa-play"></i> Play Now</button>
                    <button class="watch-trailer"><i class="fa-solid fa-play"></i> Watch Trailer</button>
                </div>
            </div>
            <div class="main-image">
                <img src="image/main-character.png" alt="Squid Game Character">
            </div>
        </main>

        <div class="scroll-text">
            <span>SCROLL</span>
        </div>

        <div class="social-icons">
            <a href="#"><i class="fa-brands fa-twitter"></i></a>
            <a href="#"><i class="fa-brands fa-instagram"></i></a>
            <a href="#"><i class="fa-brands fa-facebook-f"></i></a>
        </div>

        <section class="episodes">
            <div class="episode-card">
                <img src="image/thumb1.png" alt="Episode 1">
                <div class="play-icon">
                    <i class="fa-solid fa-play"></i>
                </div>
            </div>
            <div class="episode-card">
                <img src="image/thumb2.png" alt="Episode 2">
                <div class="play-icon">
                    <i class="fa-solid fa-play"></i>
                </div>
            </div>
            <div class="episode-card">
                <img src="image/thumb3.png" alt="Episode 3">
                <div class="play-icon">
                    <i class="fa-solid fa-play"></i>
                </div>
            </div>
        </section>
    </div>
</body>
</html>
